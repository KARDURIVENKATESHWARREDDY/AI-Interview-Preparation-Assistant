[browser]
serverAddress = "localhost"
gatherUsageStats = false

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200

[client]
toolbarMode = "auto"
showErrorDetails = true

[theme]
# Light Mode Theme (default)
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

